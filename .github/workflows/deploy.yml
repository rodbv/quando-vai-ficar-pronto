name: Deploy Slidev to GitHub Pages

on:
  push:
    branches: [main]

# Two runs that push to gh-pages at the same time make one of them fail.
concurrency:
  group: deploy-gh-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cd slides && npm install
      - run: cd slides && npx slidev build --base /quando-vai-ficar-pronto/
      - run: cd slides && npx slidev build slides.en.md --base /quando-vai-ficar-pronto/en/ --out dist/en
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./slides/dist
          publish_branch: gh-pages
